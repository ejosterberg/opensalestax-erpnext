sonar.projectKey=opensalestax-erpnext
sonar.projectName=OpenSalesTax for ERPNext
sonar.projectVersion=0.1.0

sonar.sources=opensalestax_erpnext
sonar.tests=opensalestax_erpnext/tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.10,3.14

# Exclude generated / framework-side artifacts + integration-test scaffolding
# (integration_check.py, _setup_site.py, _diagnose.py — manual-verification
# helpers, not part of the runtime package surface)
sonar.exclusions=**/tests/**,**/fixtures/**,**/__pycache__/**,**/*.json,**/dist/**,**/build/**,**/*.egg-info/**,**/integration_check.py,**/_setup_site.py,**/_diagnose.py

# Issue exclusions:
#  e1: CGNAT range hardcode (RFC 6598 well-known reserved block) — intentional
#  e2: Frappe hook signatures require positional (doc, method) args even when
#      the v0.1 audit.py stubs don't use them; underscore-prefix is the
#      Python convention but SonarQube's python:S1172 reports it anyway.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.e1.resourceKey=**/url_validator.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.e2.resourceKey=**/audit.py

sonar.host.url=http://10.32.161.205:9000
